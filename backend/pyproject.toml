[project]
name = "superdato-backend"
version = "0.1.0"
description = "SuperDato - Backend API & Ticket Ingestion Engine for Mercadona Digital Receipts"
authors = [{ name = "SuperDato Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
    "pypdf>=4.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

