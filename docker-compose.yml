services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Relational Database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: superdato_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superdato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superdato_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-superdato_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superdato} -d ${POSTGRES_DB:-superdato_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis 7 In-Memory Broker & Result Backend
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: superdato_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FastAPI REST API Backend
  # -------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTO_SEED_SAMPLES: ${AUTO_SEED_SAMPLES:-true}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:5173}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@superdato.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/integrations/google/callback}
      ENABLE_MERCADONA_ONLINE: ${ENABLE_MERCADONA_ONLINE:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------
  # Celery Asynchronous Worker
  # -------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENABLE_MERCADONA_ONLINE: ${ENABLE_MERCADONA_ONLINE:-true}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # -------------------------------------------------------------
  # Celery Beat Periodic Scheduler
  # -------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # Frontend Web Client (React + Nginx)
  # -------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: superdato_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_data:

