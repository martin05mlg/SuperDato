services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Relational Database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: superdato_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superdato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superdato_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-superdato_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superdato} -d ${POSTGRES_DB:-superdato_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis 7 In-Memory Broker & Result Backend
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: superdato_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FastAPI REST API Backend
  # -------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-insecure_dev_secret_key_change_in_production_1234567890abcdef}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-01234567890123456789012345678901}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/integrations/google/callback}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Celery Asynchronous Worker
  # -------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-insecure_dev_secret_key_change_in_production_1234567890abcdef}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-01234567890123456789012345678901}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Celery Beat Periodic Scheduler
  # -------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superdato_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-superdato}:${POSTGRES_PASSWORD:-superdato_secret_password}@db:5432/${POSTGRES_DB:-superdato_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-insecure_dev_secret_key_change_in_production_1234567890abcdef}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-01234567890123456789012345678901}
    depends_on:
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Frontend Web Client (React + Nginx)
  # -------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: superdato_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

